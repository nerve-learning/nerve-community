name: Compartir Solución de un Reto
description: Comparte el enlace de tu repositorio (creado con nerve--template) con tu solución a un reto.
title: "Solución: [NOMBRE DEL RETO]"
labels: ["solución-reto"]
body:
  - type: markdown
    attributes:
      value: "¡Felicidades por resolver este reto! Llena esta plantilla para compartir tu repositorio generado a partir de `nerve--template`. Así podremos revisar tu código y darte feedback."
  - type: dropdown
    id: lenguaje
    attributes:
      label: "¿En qué lenguaje resolviste el reto?"
      options:
        - Python
        - Rust
        - Go
        - Java
        - JavaScript / TypeScript
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: "¿Qué tipo de reto es?"
      options:
        - Reto de Módulo (Evaluado por GitHub Actions)
        - Reto Socrático
    validations:
      required: true
  - type: input
    id: modulo_nivel
    attributes:
      label: "Módulo y Nivel exactos"
      placeholder: "Ejemplo: python/Modulo-01-Fundamentos/01-hola-mundo"
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: "Enlace a tu repositorio público"
      placeholder: "https://github.com/tu-usuario/tu-repo"
    validations:
      required: true
  - type: textarea
    id: como_probar
    attributes:
      label: "¿Cómo podemos probar tu código?"
      description: "Explícanos brevemente qué comandos correr para probar tu solución."
      placeholder: "1. Ejecutar `python servidor.py` en una terminal...\n2. Ejecutar `python cliente.py` en otra..."
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: "Lista de verificación"
      options:
        - label: "Usé el repositorio `nerve--template` para crear mi proyecto."
          required: true
        - label: "Los tests automatizados (si aplican) pasan exitosamente en mi GitHub Actions."
          required: true
        - label: "Comenté mi código para explicar mis decisiones de diseño."
          required: false
        - label: "Creo que esta solución está tan pulida que podría integrarse como herramienta en `zenith-nerve-tools`."
          required: false
  - type: markdown
    attributes:
      value: "##  ¿Sabías que...?\nLas soluciones más pulidas y completas pueden ser invitadas a integrarse directamente al repositorio de producción [zenith-nerve-tools](https://github.com/Kaia-Alenia/zenith-nerve-tools), con crédito total para ti como autor/a. ¡Esfuérzate, tu código puede terminar siendo una herramienta real que otros usen!"
